  --stage1-color:#1D9E75;--stage1-bg:#e1f5ee;--stage1-bd:#9FE1CB;
  --stage2-color:#534AB7;--stage2-bg:#eeedfe;--stage2-bd:#AFA9EC;
  --stage3-color:#BA7517;--stage3-bg:#faeeda;--stage3-bd:#FAC775;
  --stage4-color:#993C1D;--stage4-bg:#faece7;--stage4-bd:#F0997B;
  --stage5-color:#A32D2D;--stage5-bg:#fcebeb;--stage5-bd:#F09595;
  --stage6-color:#5F5E5A;--stage6-bg:#f1efe8;--stage6-bd:#B4B2A9;
  --badge-hidden-bg:#faeeda;--badge-hidden-txt:#633806;--badge-visible-bg:#CECBF6;--badge-visible-txt:#26215C;--badge-special-bg:#9FE1CB;--badge-special-txt:#04342C;
  --pill-red-bg:#fcebeb;--pill-red-txt:#791f1f;--pill-amb-bg:#faeeda;--pill-amb-txt:#633806;--pill-pur-bg:#eeedfe;--pill-pur-txt:#3c3489;
  --pill-blu-bg:#e6f1fb;--pill-blu-txt:#0c447c;--pill-gry-bg:#f1efe8;--pill-gry-txt:#444441;--pill-tel-bg:#e1f5ee;--pill-tel-txt:#085041;
  --pill-ext-bg:#f1efe8;--pill-ext-txt:#888780;
}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 32px;background:var(--color-bg)}
h1{font-size:17px;font-weight:500;margin-bottom:3px}
.page-sub{font-size:12px;color:var(--color-hint);margin-bottom:18px}
/* tabs */
.prod-bar{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.pb{padding:7px 14px;font-size:12px;cursor:pointer;background:var(--color-surface);border:1px solid var(--color-border);border-radius:6px;color:var(--color-muted)}
.pb:hover{background:var(--stage6-bg);color:var(--color-text)}
.pb:focus-visible{outline:2px solid var(--stage2-color);outline-offset:2px}
.pb[aria-selected=true]{background:var(--stage6-bg);color:var(--color-text);font-weight:500;border-color:var(--color-hint)}
/* legend */
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-muted)}
.lbadge{font-size:11px;padding:2px 7px;border-radius:3px;font-weight:500;line-height:1.5}
.b-h{background:var(--badge-hidden-bg);color:var(--badge-hidden-txt)}.b-v{background:var(--badge-visible-bg);color:var(--badge-visible-txt)}.b-s{background:var(--badge-special-bg);color:var(--badge-special-txt)}
/* flow */
.flow{display:flex;flex-direction:column;position:relative}
.flow::before{content:'';position:absolute;left:var(--line-offset);top:32px;bottom:32px;width:2px;background:var(--color-border-lt);z-index:0}
.stage{display:grid;grid-template-columns:var(--label-width) 1fr;position:relative;z-index:1}
.slabel{display:flex;flex-direction:column;align-items:flex-end;padding-right:16px;padding-top:14px}
.snum{font-size:11px;font-weight:500;color:var(--color-hint);letter-spacing:.04em;line-height:1.5}
.sname{font-size:12px;font-weight:500;text-align:right;line-height:1.35;margin-top:1px}
.sbody{padding-left:22px;padding-bottom:16px;position:relative}
.dot{position:absolute;left:-6px;top:17px;width:12px;height:12px;border-radius:50%;border:2px solid;z-index:2;background:var(--color-bg)}
.box{border-radius:10px;padding:11px 13px;margin-top:5px;border:1px solid}
.box.foreign{border-style:dashed;opacity:.82}
.btitle{font-size:13px;font-weight:500;margin-bottom:4px}
.bsub{font-size:12px;color:var(--color-muted);line-height:1.6;margin-bottom:8px}
.taxes{display:flex;flex-wrap:wrap;gap:5px}
.tp{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:16px;font-size:12px;font-weight:500}
.badge{font-size:11px;padding:1px 5px;border-radius:3px;font-weight:500;margin-left:2px;line-height:1.5}
.arrow{height:14px;padding-left:22px;color:var(--color-hint);font-size:12px;display:flex;align-items:center;position:relative;z-index:1}
.s1 .dot{border-color:var(--stage1-color)}.s1 .box{border-color:var(--stage1-bd);background:var(--stage1-bg)}.s1 .btitle{color:var(--stage1-color)}
.s2 .dot{border-color:var(--stage2-color)}.s2 .box{border-color:var(--stage2-bd);background:var(--stage2-bg)}.s2 .btitle{color:var(--stage2-color)}
.s3 .dot{border-color:var(--stage3-color)}.s3 .box{border-color:var(--stage3-bd);background:var(--stage3-bg)}.s3 .btitle{color:var(--stage3-color)}
.s4 .dot{border-color:var(--stage4-color)}.s4 .box{border-color:var(--stage4-bd);background:var(--stage4-bg)}.s4 .btitle{color:var(--stage4-color)}
.s5 .dot{border-color:var(--stage5-color)}.s5 .box{border-color:var(--stage5-bd);background:var(--stage5-bg)}.s5 .btitle{color:var(--stage5-color)}
.s6 .dot{border-color:var(--stage6-color)}.s6 .box{border-color:var(--stage6-bd);background:var(--stage6-bg)}.s6 .btitle{color:var(--stage6-color)}
.tp-red{background:var(--pill-red-bg);color:var(--pill-red-txt)}.tp-amb{background:var(--pill-amb-bg);color:var(--pill-amb-txt)}
.tp-pur{background:var(--pill-pur-bg);color:var(--pill-pur-txt)}.tp-blu{background:var(--pill-blu-bg);color:var(--pill-blu-txt)}
.tp-gry{background:var(--pill-gry-bg);color:var(--pill-gry-txt)}.tp-tel{background:var(--pill-tel-bg);color:var(--pill-tel-txt)}
.tp-ext{background:var(--pill-ext-bg);color:var(--pill-ext-txt);border:1px dashed var(--color-border)}
/* summary */
.summary{margin-top:20px;background:var(--color-surface);border:1px solid var(--color-border-lt);border-radius:12px;padding:16px}
.stitle{font-size:12px;font-weight:500;color:var(--color-hint);letter-spacing:.04em;margin-bottom:12px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--stage6-bg);border-radius:8px;padding:10px}
.sc-l{font-size:11px;color:var(--color-muted);margin-bottom:2px;line-height:1.5}
.sc-v{font-size:20px;font-weight:500}
.sc-s{font-size:11px;color:var(--color-hint);line-height:1.5}
.callout{background:var(--color-bg);border-radius:8px;padding:12px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.cnum{font-size:28px;font-weight:500;color:var(--pill-red-txt);flex-shrink:0;line-height:1.1}
.cdesc{font-size:12px;color:var(--color-muted);line-height:1.7;flex:1;min-width:180px}
/* calculator */
.calc-wrap{margin-top:16px;background:var(--color-surface);border:1px solid var(--color-border-lt);border-radius:12px;padding:16px}
.calc-title{font-size:12px;font-weight:500;color:var(--color-hint);letter-spacing:.04em;margin-bottom:12px}
.c-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.c-row label{font-size:12px;color:var(--color-muted);width:170px;flex-shrink:0;padding-top:7px;line-height:1.4}
.c-row label small{display:block;font-size:10px;color:var(--color-hint)}
.c-row input[type=number]{flex:1;min-width:110px;padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;background:var(--color-surface);color:var(--color-text)}
.c-row input[type=number]:focus{outline:2px solid var(--stage2-color);outline-offset:1px}
.c-row input[type=range]{flex:1;min-width:100px;margin-top:9px}
.c-row .rval{font-size:12px;font-weight:500;min-width:40px;text-align:right;padding-top:9px}
.c-btn{padding:6px 16px;border:1px solid var(--color-border);border-radius:6px;background:var(--stage6-bg);cursor:pointer;font-size:12px;color:var(--color-text)}
.c-btn:hover{background:var(--color-border-lt)}
.c-btn:focus-visible{outline:2px solid var(--stage2-color);outline-offset:2px}
.calc-out{display:none;border-top:1px solid var(--color-border-lt);padding-top:12px;margin-top:10px}
.calc-out.show{display:block}
.cot{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--stage6-bg)}
.cot:last-of-type{border:none}
.cot span:first-child{color:var(--color-muted)}
.cot.total span{font-size:13px;font-weight:500}
.cot.total span:last-child{color:var(--pill-red-txt)}
.cot.saving span:last-child{color:var(--stage1-color);font-weight:500}
.cot.cascade{padding-left:14px;border-left:2px solid var(--color-border-lt);margin-left:4px}
.calc-note{font-size:11px;color:var(--color-hint);margin-top:8px;line-height:1.6;padding:8px 10px;background:var(--stage6-bg);border-radius:6px}
/* source */
.src-note{margin-top:14px;font-size:11px;color:var(--color-hint);border-top:1px solid var(--color-border-lt);padding-top:10px;line-height:1.7}
/* print section */
.print-section{display:none}
/* RWD */
@media(max-width:600px){
  :host{--label-width:88px}
  .prod-bar{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .c-row label{width:100%}
}
@media print{
  .prod-bar,.legend,.calc-wrap,.src-note,.summary{display:none!important}
  .flow{display:none!important}
  .print-section{display:block!important}
  .print-block{margin-bottom:32px;page-break-inside:avoid}
  .print-block h2{font-size:13px;font-weight:500;margin-bottom:8px;color:var(--color-muted)}
}
`;

/* ── 工具 ── */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return '約 '+Math.round(n).toLocaleString()+' 元';}

/* ── buildFlow ── */
function buildFlow(P){
  let hn=0,vn=0,sn=0,html='';
  P.stages.forEach((st,i)=>{
    st.taxes.forEach(t=>{if(t.h)hn++;else vn++;if(t.s)sn++;});
    if(i>0) html+='<div class="arrow" aria-hidden="true">▼</div>';
    const tx=st.taxes.map(t=>{
      const marker=t.s?'◆':(t.h?'▲':'■');
      const typeLabel=(t.s?'特種':'')+(t.h?'隱藏':'顯性')+'稅';
      const hb=`<span class="badge ${t.h?'b-h':'b-v'}">${t.h?'▲ 隱':'■ 顯'}</span>`;
      const sb=t.s?'<span class="badge b-s">◆ 特</span>':'';
      return `<span class="tp ${esc(t.c)}" title="${marker} ${esc(typeLabel)}">${esc(t.l)}${hb}${sb}</span>`;
    }).join('');
    const bCls='box'+(st.foreign?' foreign':'');
    html+=`<div class="stage ${esc(st.c)}">
      <div class="slabel"><span class="snum">STAGE ${esc(st.n)}</span><span class="sname">${esc(st.name)}</span></div>
      <div class="sbody"><div class="dot" aria-hidden="true"></div>
      <div class="${bCls}"><div class="btitle">${esc(st.t)}</div>
      <div class="bsub">${esc(st.s).replace(/\n/g,'<br>')}</div>
      <div class="taxes">${tx}</div></div></div></div>`;
  });
  return {html,hn,vn,sn};
}

      <div class="calc-note">疊加計算是進口稅的核心特性：每一層的稅基都包含前一層的稅，所以實際稅率比單看關稅率高得多。</div>
    </div>`;

  if(type==='car') return `
    <div class="calc-title">稅金試算器 ── 汽車（含2025年減免）</div>
    <div class="c-row"><label>含稅售價（元）</label><input type="number" id="car-price" min="1" placeholder="例如 800000"></div>
    <div class="c-row"><label>排氣量</label>
      <select id="car-cc" style="flex:1;padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;background:var(--color-surface);color:var(--color-text)">
        <option value="25">2000cc 以下（稅率 25%）</option>
        <option value="30">2000cc 以上（稅率 30%）</option>
      </select>
    </div>
    <div class="c-row"><label>是否符合2025年減免<small>2000cc以下，購買全新車</small></label>
      <select id="car-exempt" style="flex:1;padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;background:var(--color-surface);color:var(--color-text)">
        <option value="5">減徵5萬（新購）</option>
        <option value="10">減徵10萬（換新+新購）</option>
        <option value="0">不適用</option>
      </select>
      <button class="c-btn" id="car-btn">試算</button>
    </div>
    <div class="c-row"><label>出廠價估零售比例<small>燃油車約50%</small></label><input type="range" id="car-fr" min="30" max="70" step="5" value="50"><span class="rval" id="car-fr-v">50%</span></div>
    <div class="calc-out" id="car-out">
      <div class="cot"><span>含稅售價</span><span id="car-retail">—</span></div>
      <div class="cot"><span>估算出廠價</span><span id="car-factory">—</span></div>
      <div class="cot cascade"><span id="car-exc-l">▲ 貨物稅（出廠價 × 25%）</span><span id="car-exc">—</span></div>
      <div class="cot cascade"><span id="car-exm-l">◆ 減徵優惠（2025年新政）</span><span id="car-exm">—</span></div>
      <div class="cot cascade"><span>■ 營業稅（售價÷1.05×5%）</span><span id="car-vat">—</span></div>
      <div class="cot total"><span>消費者負擔稅金合計</span><span id="car-sum">—</span></div>
      <div class="cot total"><span>稅負佔售價</span><span id="car-pct">—</span></div>
      <div class="calc-note">貨物稅以「出廠價」為稅基，非售價。出廠比例為假設值，請依實際車款調整。</div>
    </div>`;

  if(type==='ev') return `
    <div class="calc-title">稅金試算器 ── 電動車（對比燃油車）</div>
    <div class="c-row"><label>含稅售價（元）<small>電動小客車≤140萬元完稅價格免貨物稅</small></label><input type="number" id="ev-price" min="1" placeholder="例如 1200000"><button class="c-btn" id="ev-btn">試算</button></div>
    <div class="c-row"><label>對比燃油車排氣量</label>
      <select id="ev-cc" style="flex:1;padding:6px 10px;border:1px solid var(--color-border);border-radius:6px;font-size:13px;background:var(--color-surface);color:var(--color-text)">
        <option value="25">2000cc 以下（貨物稅25%）</option>
        <option value="30">2000cc 以上（貨物稅30%）</option>
      </select>
    </div>
    <div class="c-row"><label>出廠估零售比例<small>約50%</small></label><input type="range" id="ev-fr" min="30" max="70" step="5" value="50"><span class="rval" id="ev-fr-v">50%</span></div>
    <div class="calc-out" id="ev-out">
      <div style="font-size:12px;font-weight:500;color:var(--stage1-color);margin-bottom:6px">⚡ 電動車</div>
      <div class="cot"><span>含稅售價</span><span id="ev-retail">—</span></div>
      <div class="cot cascade"><span>貨物稅（140萬以下全免，超過部分減半徵收）</span><span id="ev-excise">—</span></div>
      <div class="cot cascade"><span>■ 營業稅（售價÷1.05×5%）</span><span id="ev-vat">—</span></div>
      <div class="cot total"><span>電動車稅金合計</span><span id="ev-sum">—</span></div>
      <div style="font-size:12px;font-weight:500;color:var(--pill-red-txt);margin:10px 0 6px">🚗 同價位燃油車（試算對比）</div>
      <div class="cot cascade"><span id="ev-ice-exc-l">▲ 貨物稅（出廠估50%×25%）</span><span id="ev-ice-exc">—</span></div>
      <div class="cot cascade"><span>■ 營業稅 5%</span><span id="ev-ice-vat">—</span></div>
      <div class="cot total"><span>燃油車稅金合計</span><span id="ev-ice-sum">—</span></div>
      <div class="cot saving"><span>⚡ 電動車節省稅負</span><span id="ev-saving">—</span></div>
      <div class="calc-note">電動車完稅價格140萬以下全額免貨物稅；超過部分「減半」徵收（非全額課稅）。出廠比例為假設值，請依實際車款調整。售價超過140萬時建議諮詢專業，此試算為簡化估算。</div>
    </div>`;

  return '';
}

/* ── Web Component Class ── */
class TaxFlowChart extends HTMLElement {
  connectedCallback(){
    this._root=this.attachShadow({mode:'open'});
    this._root.innerHTML=`<style>${CSS}</style>${TEMPLATE}`;
    this._setupTabs();
    this._setupPrint();
    this._render(0);
  }

  _q(sel){return this._root.querySelector(sel);}
  _qa(sel){return this._root.querySelectorAll(sel);}

  _setupTabs(){
    const tabs=this._qa('.pb');
    tabs.forEach((b,i)=>{
      b.addEventListener('click',()=>{
        tabs.forEach(x=>{x.setAttribute('aria-selected','false');x.setAttribute('tabindex','-1');});
        b.setAttribute('aria-selected','true');
        b.setAttribute('tabindex','0');
        this._render(i);
      });
      b.addEventListener('keydown',e=>{
        let next=-1;
        if(e.key==='ArrowRight') next=(i+1)%tabs.length;
        if(e.key==='ArrowLeft')  next=(i+tabs.length-1)%tabs.length;
        if(next>=0){e.preventDefault();tabs[next].click();tabs[next].focus();}
      });
    });
  }

  _render(idx){
    const P=DATA[idx];
    const r=buildFlow(P);
    this._q('#flow').innerHTML=r.html;
    this._q('#s1').textContent=r.hn+r.vn;
    this._q('#s2').textContent=r.hn;
    this._q('#s3').textContent=r.vn;
    this._q('#s4').textContent=r.sn;
    this._q('#spct').textContent=P.pct;
    this._q('#sdesc').textContent=P.desc;
    // 動態計算器
    this._q('#calc-area').innerHTML=buildCalcHTML(P.calcType);
    this._bindCalc(P.calcType);
  }

  _bindCalc(type){
    const root=this._root;
    const liveSlider=(id,outId,suffix)=>{
      const el=root.querySelector(id);
      if(!el) return;
      el.addEventListener('input',()=>{root.querySelector(outId).textContent=el.value+suffix;});
    };
    const onEnter=(id,fn)=>{
      const el=root.querySelector(id);
      if(el) el.addEventListener('keydown',e=>{if(e.key==='Enter')fn();});
    };

    if(type==='general'){
      liveSlider('#g-fr','#g-fr-v','%');
      liveSlider('#g-hr','#g-hr-v','%');
      const fn=()=>this._calcGeneral();
      root.querySelector('#g-btn').addEventListener('click',fn);
      onEnter('#g-price',fn);
    } else if(type==='cigarette'){
      const fn=()=>this._calcCigarette();
      root.querySelector('#c-btn').addEventListener('click',fn);
      onEnter('#c-price',fn);
      onEnter('#c-packs',fn);
    } else if(type==='import'){
      const fn=()=>this._calcImport();
      root.querySelector('#i-btn').addEventListener('click',fn);
      onEnter('#i-cif',fn);
    } else if(type==='car'){
      liveSlider('#car-fr','#car-fr-v','%');
      const fn=()=>this._calcCar();
      root.querySelector('#car-btn').addEventListener('click',fn);
      onEnter('#car-price',fn);
      /* P1修正：>2000cc 時自動把減免設為「不適用」 */
      const ccSel=root.querySelector('#car-cc');
      const exSel=root.querySelector('#car-exempt');
      if(ccSel&&exSel){
        ccSel.addEventListener('change',()=>{
          if(parseInt(ccSel.value)>25) exSel.value='0';
        });
      }
    } else if(type==='ev'){
      liveSlider('#ev-fr','#ev-fr-v','%');
      const fn=()=>this._calcEV();
      root.querySelector('#ev-btn').addEventListener('click',fn);
      onEnter('#ev-price',fn);
    }
  }

  _calcGeneral(){
    const price=parseFloat(this._q('#g-price').value);
    if(!price||price<=0){return;}
    const fr=parseFloat(this._q('#g-fr').value)/100;
    const hr=parseFloat(this._q('#g-hr').value)/100;
    const exVat=price/1.05;
    const vat=exVat*0.05;
    const exc=exVat*fr*0.10;
    const hid=price*hr;
    const sum=vat+exc+hid;
    this._q('#g-total').textContent=price.toLocaleString()+' 元';
    this._q('#g-exc-l').textContent=`▲ 貨物稅（出廠估${Math.round(fr*100)}% × 10%，出廠≈${Math.round(exVat*fr).toLocaleString()}元）`;
    this._q('#g-exc').textContent=fmt(exc);
    this._q('#g-vat').textContent=fmt(vat);
    this._q('#g-hid-l').textContent=`▲ 前層轉嫁稅負（假設值 ${Math.round(hr*100)}%）`;
    this._q('#g-hid').textContent=fmt(hid);
    this._q('#g-sum').textContent=fmt(sum);
    this._q('#g-pct').textContent=(sum/price*100).toFixed(1)+'%';
    this._q('#g-out').classList.add('show');
  }

  _calcCigarette(){
    const price=parseFloat(this._q('#c-price').value);
    const packs=parseInt(this._q('#c-packs').value)||1;
    if(!price||price<=0) return;
    const CIG=31.8, HLT=20;
    const vat=price/1.05*0.05;
    const ptax=CIG+HLT+vat;
    this._q('#c-retail').textContent=price.toLocaleString()+' 元/包';
    this._q('#c-vat').textContent=`約 ${vat.toFixed(1)} 元/包`;
    this._q('#c-ptax').textContent=`約 ${ptax.toFixed(1)} 元/包`;
    this._q('#c-ppct').textContent=(ptax/price*100).toFixed(1)+'%';
    this._q('#c-n-label').textContent=`購買 ${packs} 包，總稅金`;
    this._q('#c-total').textContent=`約 ${Math.round(ptax*packs).toLocaleString()} 元`;
    this._q('#c-out').classList.add('show');
  }

  _calcImport(){
    const cif=parseFloat(this._q('#i-cif').value);
    const tarR=parseFloat(this._q('#i-tar').value)/100||0;
    const excR=parseFloat(this._q('#i-exc').value)/100||0;
    if(!cif||cif<=0) return;
    const t1=cif*tarR;
    const base2=cif+t1;
    const t2=base2*excR;
    const base3=base2+t2;
    const t3=base3*0.05;
    const sum=t1+t2+t3;
    const land=cif+sum;
    this._q('#i-cif-v').textContent=cif.toLocaleString()+' 元';
    this._q('#i-t1').textContent=fmt(t1);
    this._q('#i-base2').textContent=Math.round(base2).toLocaleString()+' 元';
    this._q('#i-t2').textContent=excR>0?fmt(t2):'0 元（未適用）';
    this._q('#i-base3').textContent=Math.round(base3).toLocaleString()+' 元';
    this._q('#i-t3').textContent=fmt(t3);
    this._q('#i-sum').textContent=fmt(sum);
    this._q('#i-land').textContent=Math.round(land).toLocaleString()+' 元';
    this._q('#i-pct').textContent=(sum/land*100).toFixed(1)+'%';
    this._q('#i-out').classList.add('show');
  }

  _calcCar(){
    const price=parseFloat(this._q('#car-price').value);
    if(!price||price<=0) return;
    const ccRate=parseFloat(this._q('#car-cc').value)/100;
    const exempt=parseFloat(this._q('#car-exempt').value)*10000;
    const fr=parseFloat(this._q('#car-fr').value)/100;
    const exVat=price/1.05;
    const factory=exVat*fr;
    const excFull=factory*ccRate;
    const excNet=Math.max(0,excFull-exempt);
    const vat=exVat*0.05;
    const sum=excNet+vat;
    this._q('#car-retail').textContent=price.toLocaleString()+' 元';
    this._q('#car-factory').textContent=Math.round(factory).toLocaleString()+' 元（估）';
    this._q('#car-exc-l').textContent=`▲ 貨物稅（出廠×${Math.round(ccRate*100)}%）`;
    this._q('#car-exc').textContent=Math.round(excFull).toLocaleString()+' 元';
    this._q('#car-exm-l').textContent=`◆ 2025年減徵優惠（${exempt>0?'-'+Math.round(exempt/10000)+'萬':'不適用'}）`;
    this._q('#car-exm').textContent=exempt>0?`-${Math.round(exempt).toLocaleString()} 元`:'0 元';
    this._q('#car-vat').textContent=fmt(vat);
    this._q('#car-sum').textContent=fmt(sum);
    this._q('#car-pct').textContent=(sum/price*100).toFixed(1)+'%';
    this._q('#car-out').classList.add('show');
  }

  _calcEV(){
    const price=parseFloat(this._q('#ev-price').value);
    if(!price||price<=0) return;
    const iceR=parseFloat(this._q('#ev-cc').value)/100;
    const fr=parseFloat(this._q('#ev-fr').value)/100;
    const exVat=price/1.05;
    const vat=exVat*0.05;
    /* 正確政策：完稅價格140萬以下全免；超過部分「減半」徵收貨物稅 */
    const taxableVal=exVat*fr;   // 出廠價估算 ≈ 完稅價格
    const exemptCap=1400000;
    const evExcise=taxableVal>exemptCap ? (taxableVal-exemptCap)*iceR*0.5 : 0;
    const evSum=vat+evExcise;
    /* ICE comparison */
    const iceExc=taxableVal*iceR;
    const iceSum=iceExc+vat;
    const saving=iceSum-evSum;
    const savingPct=iceSum>0 ? ((saving/iceSum)*100).toFixed(0)+'%' : '0%';
    this._q('#ev-retail').textContent=price.toLocaleString()+' 元';
    this._q('#ev-excise').textContent=evExcise>0
      ? `約 ${Math.round(evExcise).toLocaleString()} 元（超過140萬部分「減半」課稅）`
      : '0 元 ✓（完稅價格估算≤140萬，全額免稅）';
    this._q('#ev-excise').style.color=evExcise>0?'var(--pill-red-txt)':'var(--stage1-color)';
    this._q('#ev-vat').textContent=fmt(vat);
    this._q('#ev-sum').textContent=fmt(evSum);
    this._q('#ev-ice-exc-l').textContent=`▲ 貨物稅（出廠估${Math.round(fr*100)}%×${Math.round(iceR*100)}%）`;
    this._q('#ev-ice-exc').textContent=fmt(iceExc);
    this._q('#ev-ice-vat').textContent=fmt(vat);
    this._q('#ev-ice-sum').textContent=fmt(iceSum);
    this._q('#ev-saving').textContent=fmt(saving)+`（省 ${savingPct}）`;
    this._q('#ev-out').classList.add('show');
  }

  _setupPrint(){
    const cleanup=()=>{if(this._q('#print-section'))this._q('#print-section').innerHTML='';};
    window.addEventListener('beforeprint',()=>{
      let html='';
      DATA.forEach((P,i)=>{
        const r=buildFlow(P);
        html+=`<div class="print-block"><h2>${esc(LABELS[i])}（估計稅負 ${esc(P.pct)}）</h2>${r.html}</div>`;
      });
      this._q('#print-section').innerHTML=html;
      setTimeout(cleanup,1000);
    });
    window.addEventListener('afterprint',cleanup);
  }
}

if(!customElements.get('tax-flow-chart')){
  customElements.define('tax-flow-chart',TaxFlowChart);
}

})(); /* end IIFE */
